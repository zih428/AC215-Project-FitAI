services:
  calendar-agent:
    build: ./services/calendar-agent
    container_name: fitai-calendar-agent
    env_file:
      - ./secrets/agent.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/rich-access-471117-r0-f17d92fbf298.json
    volumes:
      - ./secrets/rich-access-471117-r0-f17d92fbf298.json:/secrets/rich-access-471117-r0-f17d92fbf298.json:ro
      - ./services/calendar-agent:/app
    depends_on:
      - db
    ports:
      - "8004:8004"

  db:
    image: postgres:15
    container_name: fitai-db
    environment:
      POSTGRES_USER: fitai
      POSTGRES_PASSWORD: fitai
      POSTGRES_DB: fitai_app
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./services/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"   # expose Postgres so VS Code (localhost) can connect

  core-etl-api:
    build: ./services/core-etl-api
    container_name: fitai-core-etl-api
    environment:
      POSTGRES_USER: fitai
      POSTGRES_PASSWORD: fitai
      POSTGRES_DB: fitai_app
      POSTGRES_HOST: db   # internal Docker DNS, works inside network
      POSTGRES_PORT: 5432
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/rich-access-471117-r0-f17d92fbf298.json
    volumes:
      - ./secrets/rich-access-471117-r0-f17d92fbf298.json:/secrets/rich-access-471117-r0-f17d92fbf298.json:ro
      - ./services/core-etl-api:/app   # mount your pipeline code
    depends_on:
      - db
    ports:
      - "8001:8001"

  ocr-engine:
    build: ./services/ocr-engine
    container_name: fitai-ocr-engine
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/rich-access-471117-r0-f17d92fbf298.json
    volumes:
      - ./secrets/rich-access-471117-r0-f17d92fbf298.json:/secrets/rich-access-471117-r0-f17d92fbf298.json:ro
      - ./services/ocr-engine:/app
    ports:
      - "8003:8003"

  rag-service:
    build:
      context: ./services/rag-service
    container_name: fitai-rag-service
    volumes:
      - ./services/rag-service:/app
      - ./secrets/rich-access-471117-r0-f17d92fbf298.json:/secrets/rich-access-471117-r0-f17d92fbf298.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/rich-access-471117-r0-f17d92fbf298.json
      GCP_PROJECT: rich-access-471117-r0
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
    depends_on:
      - chromadb
    ports:
      - "8002:8002"

  chromadb:
    image: chromadb/chroma:latest
    container_name: llm-rag-chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./docker-volumes/chromadb:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_CORS_ALLOW_ORIGINS=["*"]
      
  frontend:
    build:
      context: ./services/frontend
    container_name: fitai-frontend
    depends_on:
      - core-etl-api
      - rag-service
    ports:
      - "3000:3000"

volumes:
  db-data:
