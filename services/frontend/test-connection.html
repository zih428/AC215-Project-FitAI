<!DOCTYPE html>
<html>
<head>
    <title>RAG Service Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
    </style>
</head>
<body>
    <h1>RAG Service Connection Test</h1>
    
    <button onclick="testConnection()">Test Connection</button>
    <button onclick="testCORS()">Test CORS</button>
    <button onclick="testChat()">Test Chat API</button>
    
    <div id="results"></div>

    <script>
        async function testConnection() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test-result">Testing...</div>';
            
            try {
                const response = await fetch('http://localhost:8002/health');
                const data = await response.json();
                
                if (data.status === 'ok' && data.service === 'rag-service') {
                    resultsDiv.innerHTML = `
                        <div class="test-result success">
                            ✅ Connection successful!<br>
                            Status: ${data.status}<br>
                            Service: ${data.service}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="test-result error">
                            ⚠️ Unexpected response format<br>
                            ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Connection failed<br>
                        Error: ${error.message}<br>
                        <br>
                        Possible causes:<br>
                        1. RAG service is not running<br>
                        2. CORS configuration issues<br>
                        3. Port is in use<br>
                        <br>
                        Please verify:<br>
                        - Container is running: docker ps | grep rag<br>
                        - Service responds: curl http://localhost:8002/health
                    </div>
                `;
            }
        }

        async function testCORS() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test-result">Testing CORS...</div>';
            
            try {
                const response = await fetch('http://localhost:8002/health', {
                    method: 'GET',
                    headers: {
                        'Origin': 'http://localhost:3000'
                    }
                });
                
                const headers = {};
                response.headers.forEach((value, key) => {
                    headers[key] = value;
                });
                
                const data = await response.json();
                
                if (headers['access-control-allow-origin']) {
                    resultsDiv.innerHTML = `
                        <div class="test-result success">
                            ✅ CORS headers present<br>
                            Allow-Origin: ${headers['access-control-allow-origin']}<br>
                            Allow-Methods: ${headers['access-control-allow-methods'] || 'N/A'}<br>
                            <br>
                            Response data: ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="test-result error">
                            ⚠️ Missing CORS headers<br>
                            Response headers: ${JSON.stringify(headers, null, 2)}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ CORS test failed<br>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        async function testChat() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test-result">Testing Chat API...</div>';
            
            try {
                const response = await fetch('http://localhost:8002/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: 'What is fitness?',
                        method: 'char-split',
                        n_results: 5
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    resultsDiv.innerHTML = `
                        <div class="test-result success">
                            ✅ Chat API working<br>
                            Status: ${data.status}<br>
                            Context Chunks: ${data.context_chunks_count || 'N/A'}<br>
                            <br>
                            Response preview: ${data.response.substring(0, 200)}...
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="test-result error">
                            ⚠️ Chat API returned an unexpected response<br>
                            ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Chat API test failed<br>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Auto-run connection test on load
        window.onload = () => {
            testConnection();
        };
    </script>
</body>
</html>
