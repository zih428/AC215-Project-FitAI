<!DOCTYPE html>
<html>
<head>
    <title>RAG Service Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
    </style>
</head>
<body>
    <h1>RAG 服务连接测试</h1>
    
    <button onclick="testConnection()">测试连接</button>
    <button onclick="testCORS()">测试 CORS</button>
    <button onclick="testChat()">测试 Chat API</button>
    
    <div id="results"></div>

    <script>
        async function testConnection() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test-result">正在测试...</div>';
            
            try {
                const response = await fetch('http://localhost:8002/health');
                const data = await response.json();
                
                if (data.status === 'ok' && data.service === 'rag-service') {
                    resultsDiv.innerHTML = `
                        <div class="test-result success">
                            ✅ 连接成功！<br>
                            Status: ${data.status}<br>
                            Service: ${data.service}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="test-result error">
                            ⚠️ 响应格式不正确<br>
                            ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ 连接失败<br>
                        错误: ${error.message}<br>
                        <br>
                        可能的原因：<br>
                        1. RAG 服务未运行<br>
                        2. CORS 配置问题<br>
                        3. 端口被占用<br>
                        <br>
                        请检查：<br>
                        - Docker 容器是否运行: docker ps | grep rag<br>
                        - 服务是否响应: curl http://localhost:8002/health
                    </div>
                `;
            }
        }

        async function testCORS() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test-result">正在测试 CORS...</div>';
            
            try {
                const response = await fetch('http://localhost:8002/health', {
                    method: 'GET',
                    headers: {
                        'Origin': 'http://localhost:3000'
                    }
                });
                
                const headers = {};
                response.headers.forEach((value, key) => {
                    headers[key] = value;
                });
                
                const data = await response.json();
                
                if (headers['access-control-allow-origin']) {
                    resultsDiv.innerHTML = `
                        <div class="test-result success">
                            ✅ CORS 配置正确！<br>
                            Allow-Origin: ${headers['access-control-allow-origin']}<br>
                            Allow-Methods: ${headers['access-control-allow-methods'] || 'N/A'}<br>
                            <br>
                            响应数据: ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="test-result error">
                            ⚠️ CORS 头缺失<br>
                            响应头: ${JSON.stringify(headers, null, 2)}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ CORS 测试失败<br>
                        错误: ${error.message}
                    </div>
                `;
            }
        }

        async function testChat() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test-result">正在测试 Chat API...</div>';
            
            try {
                const response = await fetch('http://localhost:8002/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: 'What is fitness?',
                        method: 'char-split',
                        n_results: 5
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    resultsDiv.innerHTML = `
                        <div class="test-result success">
                            ✅ Chat API 工作正常！<br>
                            Status: ${data.status}<br>
                            Context Chunks: ${data.context_chunks_count || 'N/A'}<br>
                            <br>
                            响应预览: ${data.response.substring(0, 200)}...
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="test-result error">
                            ⚠️ Chat API 响应异常<br>
                            ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Chat API 测试失败<br>
                        错误: ${error.message}
                    </div>
                `;
            }
        }

        // 自动测试连接
        window.onload = () => {
            testConnection();
        };
    </script>
</body>
</html>
